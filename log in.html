<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login|Lumiora</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
                <img src="lumiora logo.png" alt="Lumiora">
                <h1>LUMIORA</h1>
        </header>
        <main>
            <section class="login">
                <h2> 
                    Glad to see you,
                    <br>
                    Login to continue where you stopped 
                </h2>
                <form id="loginform">
                    <label for="fullname">
                        Full Name
                    </label>
                        <input 
                        type="text"
                        id="fullname"
                        placeholder="Enter your fullname">
                    <label for="email">
                        Email
                    </label>
                        <input 
                        type="email"
                        id="email"
                        placeholder="Enter your email">
                    <label for="password">
                        Password
                    </label>
                        <input 
                        type="password"
                        id="password"
                        placeholder="Enter you password">
                    <button type="submit">
                        Login
                    </button>
                </form>
                <p>
                    Don't have an account?
                    <br>
                    <a href="signup.html">
                        Signup
                    </a>
                </p>
            </section>
            <a href="index.html" class="back-link">Back to Home</a>
        </main>
        <script src="script.js"></script>
    </body>
</html>
