<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up|Lumiora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="lumiora logo.png" alt="Lumiora Logo">
        <h1>LUMIORA</h1>
    </header>
    <main>
        <section class="Signup">
            <h2>Create Your Account</h2>
            <p>Join Lumiora and Start Your Journey towards excellence</p>
            <form id="signupform">
                <label for="fullname">
                    Full Name
                </label>
                    <input
                    type="text"
                    id="fullname"
                    placeholder="Enter Your Full Name">
                <label for="email">
                    Email
                </label>
                    <input
                    type="email"
                    id="email"
                    placeholder="Enter Your Email">
                <label for="password">
                    Password
                </label>
                    <input 
                    type="password"
                    id="password"
                    placeholder="Create a password">
                <label for="confirmpassword">
                    Confirm Password
                </label>
                    <input 
                    type="password"
                    id="confirm password"
                    placeholder="Confirm your password">
                <button type="submit">
                    Create Account
                </button>
            </form>
            <p>
                Already have an account?
                <br>
                <a href="log in.html">
                    Log In
                </a>
            </p>
        </section>
        <a href="index.html" class="back-link">Back to Home</a>
    </main>
    <script src="script.js"></script>
</body>
</html>
